# ============ Spring AI + RAG + 向量存储配置 ============
# 请将此配置合并到 erp-api/src/main/resources/application.yml

spring:
  # 本机开发密钥（仓库根目录 application-local.yml，已 gitignore）；
  # 放在 profile 配置文件里导入，保证其优先级高于本文件的占位默认值。
  config:
    import: optional:file:./application-local.yml

  # ============ AI配置 ============
  ai:
    # Embedding 提供方：默认 ollama（本地免费，无需云 Key）
    # 若要用阿里云百炼，设 EMBEDDING_PROVIDER=openai 并把下面 openai.embedding.enabled 打开
    model:
      embedding: ${EMBEDDING_PROVIDER:ollama}

    # ============ 本地 Ollama Embedding（默认，1024 维 bge-m3）============
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        enabled: true
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}

    # DeepSeek模型配置
    # DeepSeek模型配置
    deepseek:
      chat:
        enabled: true
        base-url: https://api.deepseek.com
        api-key: ${DEEPSEEK_API_KEY:}
        options:
          model: deepseek-chat
          temperature: 0.7
          max-tokens: 2000

    # OpenAI格式API配置（兼容DeepSeek/阿里云百炼/Ollama等）
    openai:
      # 公共凭证层（Embedding自动配置从此读取，chat由DeepSeek starter独立处理）
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      chat:
        enabled: true
        base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
        api-key: ${OPENAI_API_KEY:}
        options:
          model: ${OPENAI_MODEL:deepseek-chat}
          temperature: 0.7
          max-tokens: 2000

      # Embedding模型配置（向量化，阿里云百炼）
      embedding:
        enabled: ${OPENAI_EMBEDDING_ENABLED:false}
        base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        api-key: ${DASHSCOPE_API_KEY:}
        options:
          model: text-embedding-v3

    # 向量存储配置（PGVector）——自动配置禁用，由PgVectorManualConfig手动创建
    vectorstore:
      pgvector:
        enabled: false
        url: ${PGVECTOR_URL:jdbc:postgresql://localhost:5432/erp_vector}
        username: ${PGVECTOR_USERNAME:postgres}
        password: ${PGVECTOR_PASSWORD:}
        driver-class-name: org.postgresql.Driver
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        remove-existing-vector-store-table: false
        initialize-schema: true
        schema-name: public
        table-name: vector_store

    # RAG配置
    rag:
      retrieval:
        top-k: 10
        similarity-threshold: 0.7
      rerank:
        enabled: true
        top-n: 20

  # ============ Redis配置（会话记忆 + 分布式锁）============
  data:
    redis:
      host: localhost
      port: 6379
      # 注意：本机Redis未设置密码，请勿配置password（否则AUTH报错）
      # 若 Redis 设置了密码，用环境变量注入：password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 6000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  # ============ 数据源配置（支持多数据源）============
  datasource:
    # MySQL主数据库（业务数据）
    primary:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: ${MYSQL_URL:jdbc:mysql://localhost:3306/qihang_erp?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8}
      username: ${MYSQL_USERNAME:root}
      password: ${MYSQL_PASSWORD:}

    # PostgreSQL向量数据库（RAG知识库）
    pgvector:
      driver-class-name: org.postgresql.Driver
      url: ${PGVECTOR_URL:jdbc:postgresql://localhost:5432/erp_vector}
      username: ${PGVECTOR_USERNAME:postgres}
      password: ${PGVECTOR_PASSWORD:}


# ============ Agent配置 ============
agent:
  # 自治等级配置
  autonomy:
    default-level: SUGGEST
    approval-timeout: 300

  # 向量存储开关（PGVector）
  # 默认不启用（PgVectorManualConfig 的 @ConditionalOnProperty matchIfMissing=false）：
  #   - Docker/服务器：设置环境变量 AGENT_VECTOR_STORE_ENABLED=true
  #   - 本机开发：在仓库根目录 application-local.yml 中设置 agent.vector-store.enabled: true
  # 不启用时应用不依赖 PostgreSQL，检索降级为 MySQL FULLTEXT → BM25
  vector-store:
    host: ${PGVECTOR_HOST:localhost}
    port: ${PGVECTOR_PORT:5432}
    database: ${PGVECTOR_DATABASE:erp_vector}
    username: ${PGVECTOR_USERNAME:postgres}
    password: ${PGVECTOR_PASSWORD:}
    dimensions: 1024

  # RAG配置
  rag:
    retrieval-top-k: 10
    rerank-enabled: true
    similarity-threshold: 0.7
    chunk-size: 500
    chunk-overlap: 50

  # 记忆配置
  memory:
    working-ttl: 3600        # Working层1小时
    session-ttl: 86400       # Session层1天
    user-ttl: 2592000        # User层30天
    team-ttl: 7776000        # Team层90天

  # 评测配置
  evaluation:
    enabled: true
    schedule: "0 0 2 * * SUN"  # 每周日凌晨2点跑评测
    recall-target: 0.8
    mrr-target: 0.7
    llm-enabled: false          # 真实LLM质量打分开关，开启后产生API费用且评测耗时变长
    llm-timeout-seconds: 60
    llm-max-attempts: 3
    context-limit: 10           # 生成与裁判读取的检索上下文数量，应与评测TopK对齐

# ============ 监控（Micrometer / Prometheus）============
# 工具调用指标同时写入 MeterRegistry，Prometheus 可抓取 /actuator/prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: qihang-erp-agent
    distribution:
      percentiles-histogram:
        agent.tool.duration: true
