server:
  port: 6149

spring:
  application:
    name: erp-api
  profiles:
    active: dev,agent

  data:
    # redis 配置
    redis:
      # 地址
      #    host: 8.130.98.215
      host: 127.0.0.1
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      #    password: 123321
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms
  datasource:
    driverClassName: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/qihang-erp?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      min-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  flyway:
    # 启动时自动执行 db/migration 下的 V1 脚本，使 agent 表结构可在干净环境重建。
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    # 现有库已有业务表且无 flyway 历史，允许在已有库上建立基线，避免从头重建。
    baseline-on-migrate: true
    baseline-version: 1
    # 手工执行过的脚本可能与迁移内容有差异，不强制校验，避免启动被阻断。
    validate-on-migrate: false
    out-of-order: false
    table: flyway_schema_history
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
