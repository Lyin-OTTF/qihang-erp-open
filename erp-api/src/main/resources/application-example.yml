# ============================================
# 启航ERP Agent - 配置示例模板
# ============================================
# 使用说明：
# 1. 复制本文件为 application-local.yml（或直接设置环境变量）
# 2. 填入你自己的真实密钥
# 3. 切勿将包含真实密钥的配置文件提交到Git
# 4. 所有密钥均通过环境变量注入，yml中只保留占位符
# ============================================

# ============ 必须设置的环境变量 ============
# MySQL数据库
# MYSQL_URL=jdbc:mysql://127.0.0.1:3306/qihang-erp?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
# MYSQL_USERNAME=root
# MYSQL_PASSWORD=你的MySQL密码

# PostgreSQL向量数据库（RAG知识库，可选，不启用则降级为MySQL全文检索+BM25）
# PGVECTOR_URL=jdbc:postgresql://localhost:5432/erp_vector
# PGVECTOR_USERNAME=postgres
# PGVECTOR_PASSWORD=你的PostgreSQL密码

# DeepSeek大模型API（对话+评测）
# DEEPSEEK_API_KEY=sk-你的DeepSeek密钥

# 阿里云百炼DashScope（Embedding向量化，可选，不启用则RAG降级）
# DASHSCOPE_API_KEY=sk-你的DashScope密钥

# JWT签名密钥（登录鉴权，建议使用随机字符串，至少32位）
# JWT_SECRET=你的JWT签名密钥

# Redis密码（可选，本地无密码可不设）
# REDIS_PASSWORD=你的Redis密码

# ============ 可选环境变量 ============
# OPENAI_BASE_URL=https://api.deepseek.com
# OPENAI_API_KEY=sk-你的OpenAI兼容密钥
# OPENAI_MODEL=deepseek-chat
# DASHSCOPE_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode/v1
# PGVECTOR_HOST=localhost
# PGVECTOR_PORT=5432
# PGVECTOR_DATABASE=erp_vector

server:
  port: 6149

spring:
  application:
    name: erp-api
  profiles:
    active: dev,agent

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 10s

  datasource:
    driverClassName: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:}
    username: ${MYSQL_USERNAME:}
    password: ${MYSQL_PASSWORD:}

  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: false
    table: flyway_schema_history

  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*Mapper.xml

deepseek:
  api:
    key: ${DEEPSEEK_API_KEY:}
    endpoint: https://api.deepseek.com/chat/completions
    model: deepseek-chat

token:
  expireTime: 60
  secret: ${JWT_SECRET:}
